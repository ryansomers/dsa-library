[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-library"
version = "0.1.0"
description = "Data structures and algorithms implemented from scratch, with tests and Big-O notes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryan Somers" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]
bench = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["dsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs external services (none currently)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["dsa"]
